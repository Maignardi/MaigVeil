name: Publish MaigVeil to Maven Central & Gradle Plugin Portal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 37, CMake 3.22.1 & NDK 28.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches VERSION_NAME
        run: |
          VERSION_NAME=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag version: $TAG_VERSION | gradle.properties VERSION_NAME: $VERSION_NAME"
            if [[ "$TAG_VERSION" != "$VERSION_NAME" ]]; then
              echo "::error::Tag version ($TAG_VERSION) does not match VERSION_NAME ($VERSION_NAME) in gradle.properties"
              exit 1
            fi
          fi
          if [[ "$VERSION_NAME" == *-SNAPSHOT ]]; then
            echo "::error::Release VERSION_NAME must not end with -SNAPSHOT ($VERSION_NAME)"
            exit 1
          fi

      - name: Run plugin unit tests
        run: ./gradlew -p maigveil-plugin test --no-configuration-cache

      - name: Run C++20 native crypto & anti-hook tests
        run: |
          clang++ -std=c++20 -O2 \
            maigveil-runtime/src/test/cpp/native_crypto_test.cpp \
            maigveil-runtime/src/main/cpp/crypto_engine.cpp \
            maigveil-runtime/src/main/cpp/anti_tamper.cpp \
            -o /tmp/mv_native_test
          /tmp/mv_native_test

      - name: Run library unit tests
        run: ./gradlew :maigveil-annotations:test :maigveil-runtime:testDebugUnitTest --no-configuration-cache

      - name: Publish libraries to Maven Central (Central Portal)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Publish Gradle Plugin to Gradle Plugin Portal
        if: ${{ secrets.GRADLE_PUBLISH_KEY != '' && secrets.GRADLE_PUBLISH_SECRET != '' }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p maigveil-plugin publishPlugins --no-configuration-cache

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
